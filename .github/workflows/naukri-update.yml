name: Naukri Profile Daily Update

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC (IST is UTC+5:30)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Naukri Update
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/UpdateNaukriProfile.cy.js
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
