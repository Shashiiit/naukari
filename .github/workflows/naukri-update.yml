name: Naukri Profile Daily Update

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC (IST is UTC+5:30)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify secrets are set
        run: |
          echo "Username length: ${#NAUKRI_USERNAME}"
          echo "Password length: ${#NAUKRI_PASSWORD}"
          if [ -z "$NAUKRI_USERNAME" ]; then echo "WARNING: NAUKRI_USERNAME is empty!"; fi
          if [ -z "$NAUKRI_PASSWORD" ]; then echo "WARNING: NAUKRI_PASSWORD is empty!"; fi
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}

      - name: Debug: print FORCE_FALLBACK env
        run: |
          echo "FORCE_FALLBACK='$FORCE_FALLBACK'"
          echo "CYPRESS_FORCE_FALLBACK='$CYPRESS_FORCE_FALLBACK'"
        env:
          FORCE_FALLBACK: "true"
          CYPRESS_FORCE_FALLBACK: "true"

      - name: Run Cypress Naukri Update
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/UpdateNaukriProfile.cy.js
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          FORCE_FALLBACK: "true"
          CYPRESS_FORCE_FALLBACK: "true"
